<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SW Defect Hub</title><link rel="stylesheet" href="/static/style.css"><script defer src="/static/app.js"></script></head>
<body>
<header><a class="brand" href="/">◈ <span>SW Defect Hub<small>CL SCAN · REVIEW · INSIGHT</small></span></a><div class="header-right"><span class="tag">팀 공동 작업</span><button id="upload-open" class="primary">＋ 결과 등록</button></div></header>
<div class="layout"><aside><div class="aside-heading">WORKSPACE</div><button id="home" class="navbutton">전체 결과</button><div id="navigation"></div><div class="aside-note">릴리스 → 브랜치 → 파트 → CL<br>실행 이력과 원본 보고서를 함께 관리합니다.</div></aside>
<main><div id="breadcrumbs" class="breadcrumbs"></div><div id="message" role="status" hidden></div><div id="content" aria-live="polite"></div></main></div>
<dialog id="upload-dialog"><form id="upload-form"><div class="dialog-head"><div><div class="eyebrow">SCAN RESULT</div><h2>검사 결과 등록</h2></div><button type="button" id="upload-close" aria-label="닫기">✕</button></div>
<p class="muted">완료된 CL 검사 결과를 등록합니다. 재검사는 새 실행으로 보관됩니다.</p>
<div class="form-grid"><label>릴리스<input name="release" placeholder="SVR26B" maxlength="80" required></label><label>브랜치<input name="branch" placeholder="REL COMMON" maxlength="80" required></label><label>파트<select name="part" required></select></label><label>Perforce CL<input name="cl" inputmode="numeric" pattern="[1-9][0-9]{0,19}" placeholder="123456" required></label><label>등록자<input name="uploader" maxlength="80" required></label><label>실행 결과<select name="status"><option value="completed">정상 완료</option><option value="failed">실패</option><option value="cancelled">중단</option></select></label></div>
<label>실행 ID<input name="execution_id" maxlength="120" required><small>재전송 시 유지합니다. 실제 재검사는 새 ID를 사용하세요.</small></label>
<label class="check"><input type="checkbox" name="no_findings"> 정상 완료 · Finding 없음 (0건)</label>
<label>Finding MD 파일<input type="file" name="files" accept=".md" multiple><small>UTF-8 · 파일당 5 MiB · 최대 100개, 합계 50 MiB</small></label>
<label>검사 메모 / 실패 사유<textarea name="notes" maxlength="10000" rows="3"></textarea></label><p id="upload-error" class="error" role="alert"></p><div class="dialog-foot"><button type="submit" class="primary">결과 등록</button></div></form></dialog>
<footer>SW Defect Hub · 릴리스별 코드 검사 결과 관리</footer>
</body></html>
