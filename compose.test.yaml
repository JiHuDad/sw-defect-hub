# Separate disposable PostgreSQL 17 test environment. No production volume or exposed port.
name: sw-defect-hub-test
services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      POSTGRES_DB: tests
      POSTGRES_USER: tests
      POSTGRES_PASSWORD: disposable-test-password
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U tests -d tests']
      interval: 3s
      timeout: 3s
      retries: 30
  tests:
    build:
      context: .
      target: test
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
      secrets:
        - pip_config
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://tests:disposable-test-password@db:5432/tests
      PYTHONDONTWRITEBYTECODE: '1'
    depends_on:
      db:
        condition: service_healthy
secrets:
  pip_config:
    file: ./.pip.conf
